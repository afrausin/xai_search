<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xAI Search - Powered by Grok</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <main>
            <div class="two-column-layout">
                <div class="search-panel">
                    <h2 class="search-panel-title">Search Settings</h2>
                    <div class="form-group">
                    <label for="search-query">Search Query</label>
                    <textarea 
                        id="search-query" 
                        rows="1"
                        placeholder="What would you like to search for?"
                        style="resize: none; overflow: hidden; min-height: 2.5rem;"
                        title="Enter your search query. Grok will search across selected sources and provide an AI-generated summary."
                    ></textarea>
                </div>

                <div class="form-group">
                    <label>Search Sources</label>
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" name="source" value="web" checked>
                            <span class="checkbox-custom"></span>
                            <span>Web</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="source" value="news">
                            <span class="checkbox-custom"></span>
                            <span>News</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="source" value="x">
                            <span class="checkbox-custom"></span>
                            <span>X (Twitter)</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="country">Country / Region</label>
                    <select id="country" name="country" title="Filter Web and News results by country. Only affects Web and News sources, not X (Twitter)."
                        <option value="">All Countries</option>
                        <option value="US" selected>United States</option>
                        <option value="GB">United Kingdom</option>
                        <option value="CA">Canada</option>
                        <option value="AU">Australia</option>
                        <option value="DE">Germany</option>
                        <option value="FR">France</option>
                        <option value="IT">Italy</option>
                        <option value="ES">Spain</option>
                        <option value="NL">Netherlands</option>
                        <option value="SE">Sweden</option>
                        <option value="NO">Norway</option>
                        <option value="DK">Denmark</option>
                        <option value="FI">Finland</option>
                        <option value="CH">Switzerland</option>
                        <option value="AT">Austria</option>
                        <option value="BE">Belgium</option>
                        <option value="IE">Ireland</option>
                        <option value="NZ">New Zealand</option>
                        <option value="SG">Singapore</option>
                        <option value="JP">Japan</option>
                        <option value="KR">South Korea</option>
                        <option value="CN">China</option>
                        <option value="IN">India</option>
                        <option value="BR">Brazil</option>
                        <option value="MX">Mexico</option>
                        <option value="AR">Argentina</option>
                        <option value="ZA">South Africa</option>
                        <option value="RU">Russia</option>
                        <option value="PL">Poland</option>
                        <option value="TR">Turkey</option>
                    </select>
                    <small>Filter Web/News by country</small>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="from-date">From Date</label>
                        <input type="date" id="from-date" title="Start date for search results. Works best with X (Twitter), may be inconsistent with News.">
                    </div>
                    <div class="form-group">
                        <label for="to-date">To Date</label>
                        <input type="date" id="to-date" title="End date for search results. Works best with X (Twitter), may be inconsistent with News.">
                    </div>
                </div>

                <div class="form-group">
                    <label for="max-results">Max Results</label>
                    <input 
                        type="number" 
                        id="max-results" 
                        min="1" 
                        max="29" 
                        value="20"
                        title="Maximum number of search results to retrieve (1-29). More results = more comprehensive but slower and more expensive."
                    >
                    <small>1-29 (API limit)</small>
                </div>

                <div class="form-section">
                    <h3 class="form-section-title">X (Twitter) Filters</h3>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr 0.8fr 0.8fr; gap: 0.75rem;">
                        <div class="form-group">
                            <label for="included-handles">Include</label>
                            <input 
                                type="text" 
                                id="included-handles" 
                                placeholder="handles"
                                title="Only search posts from these X handles (comma-separated, max 10). Example: elonmusk, wayfair. Cannot be used with excluded handles."
                            >
                            <small>Max 10</small>
                        </div>
                        <div class="form-group">
                            <label for="excluded-handles">Exclude</label>
                            <input 
                                type="text" 
                                id="excluded-handles" 
                                placeholder="handles"
                                title="Exclude posts from these X handles (comma-separated, max 10). Example: spambot, competitor. Cannot be used with included handles."
                            >
                            <small>Max 10</small>
                        </div>
                        <div class="form-group">
                            <label for="min-favorites">Min Favs</label>
                            <input 
                                type="number" 
                                id="min-favorites" 
                                min="0" 
                                placeholder="1000"
                                title="Only show posts with at least this many likes/favorites. Higher = more popular/viral content."
                            >
                        </div>
                        <div class="form-group">
                            <label for="min-views">Min Views</label>
                            <input 
                                type="number" 
                                id="min-views" 
                                min="0" 
                                placeholder="10000"
                                title="Only show posts with at least this many views. Higher = more widely-seen content."
                            >
                        </div>
                    </div>
                </div>

                    <button id="search-btn" class="search-btn">
                        <span class="btn-text">Search</span>
                        <span class="btn-loader" style="display: none;">Searching...</span>
                    </button>

                    <div class="form-section">
                        <h3 class="form-section-title">Advanced</h3>
                        <div class="form-group">
                            <label for="system-prompt">System Prompt</label>
                            <textarea 
                                id="system-prompt" 
                                rows="2"
                                placeholder="Customize Grok's behavior..."
                                title="Customize how Grok responds to your search. This instructs the AI on how to format and present the results."
                            >You are a search assistant. ONLY use information from the provided search results. If no relevant results are found in the specified date range, explicitly state that no information was found for that time period. Do not use your general knowledge.</textarea>
                            <small>Customize AI behavior</small>
                        </div>
                    </div>
                </div>

                <div class="results-column">
                    <header>
                        <h1>xAI Search</h1>
                        <p class="subtitle">Search across Web, News, and X with date filtering</p>
                        <a href="batch.html" style="color: var(--primary-color); text-decoration: none; font-size: 0.875rem; border: 1px solid var(--primary-color); padding: 0.5rem 1rem; border-radius: 0.25rem; display: inline-block; margin-top: 0.5rem;">
                            Batch Monthly Search →
                        </a>
                    </header>

                    <div id="results-container" class="results-container" style="display: none;">
                <div class="results-header">
                    <h2>Search Results</h2>
                    <span id="results-count" class="results-count"></span>
                </div>
                <div id="results" class="results"></div>
            </div>

                    <div id="error-container" class="error-container" style="display: none;"></div>
                </div>
            </div>
        </main>

        <footer>
            <p>Powered by <a href="https://x.ai/" target="_blank">xAI</a> Grok API</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
